name: AION ARD Branch Bootstrap

on:
  push:
    branches:
      - feat/ard-discovery-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply bounded patch
        run: python scripts/bootstrap_ard_branch.py
      - name: Verify and commit
        run: |
          git diff --check
          test ! -e .github/workflows/ard-branch-bootstrap.yml
          test ! -e scripts/bootstrap_ard_branch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose bounded ARD discovery manifest"
          git push origin HEAD:feat/ard-discovery-v1
