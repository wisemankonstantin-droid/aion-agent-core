name: AION AgentNative Free Canary

on:
  push:
    branches:
      - ops/mcp-registry-verify-20260914

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Send one free A2A sample request
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          import uuid

          endpoint = "https://agentnative.cazimedia.com/a2a"
          prompt = "Show me useful free data with provenance."
          payload = {
              "jsonrpc": "2.0",
              "id": "aion-bounded-free-canary",
              "method": "SendMessage",
              "params": {
                  "message": {
                      "messageId": "aion-canary-" + uuid.uuid4().hex,
                      "role": "ROLE_USER",
                      "parts": [{"text": prompt}],
                  }
              },
          }
          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "A2A-Version": "1.0",
                  "User-Agent": "AION-bounded-free-canary/1.0",
              },
              method="POST",
          )
          try:
              response = urllib.request.urlopen(request, timeout=30)
          except urllib.error.HTTPError as exc:
              response = exc

          with response:
              raw = response.read(256 * 1024)
              status = getattr(response, "status", None) or getattr(response, "code", None)
          text = raw.decode("utf-8", errors="replace")
          try:
              body = json.loads(text)
          except Exception:
              body = {"raw": text[:1000]}

          serialized = json.dumps(body, ensure_ascii=False).lower()
          payment_required = any(marker in serialized for marker in (
              "payment required", "payment_required", "x402", "settle", "paymentpayload"
          ))
          has_error = isinstance(body, dict) and bool(body.get("error"))
          result_text = ""
          try:
              result_text = body["result"]["message"]["parts"][0]["text"]
          except Exception:
              pass

          summary = {
              "target": "com.cazimedia.agentnative_data_exchange",
              "http_status": status,
              "jsonrpc_error": has_error,
              "payment_required": payment_required,
              "response_text_length": len(result_text),
              "mentions_provenance": "provenance" in result_text.lower(),
              "write_operation": False,
              "payment_executed": False,
              "single_request": True,
          }
          print(json.dumps(summary, sort_keys=True))

          if status != 200 or has_error or payment_required or not result_text:
              raise SystemExit(2)
          PY
