name: AION Bounty Market Scan

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOUNTY_AGENT_API_KEY: ${{ secrets.BOUNTY_AGENT_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Poll Bounty read-only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          from app.services.bounty_market import list_bounties, list_release_events

          if not os.getenv("BOUNTY_AGENT_API_KEY"):
              print(json.dumps({
                  "status": "not_configured",
                  "write_operations_enabled": False,
                  "claim_enabled": False,
                  "submission_enabled": False,
                  "payment_enabled": False,
              }, sort_keys=True))
              raise SystemExit(0)

          bounties = list_bounties()
          events = list_release_events(limit=50)
          if bounties.status != "success" or events.status != "success":
              print(json.dumps({
                  "status": "provider_check_failed",
                  "bounty_status": bounties.status,
                  "bounty_failure_class": bounties.failure_class,
                  "event_status": events.status,
                  "event_failure_class": events.failure_class,
                  "write_operations_enabled": False,
                  "payment_enabled": False,
              }, sort_keys=True))
              raise SystemExit(1)

          candidate_count = len(bounties.results)
          release_event_count = len(events.results)
          print(json.dumps({
              "status": "success",
              "candidate_count": candidate_count,
              "release_event_count": release_event_count,
              "write_operations_enabled": False,
              "claim_enabled": False,
              "submission_enabled": False,
              "payment_enabled": False,
          }, sort_keys=True))

          # Intentionally do not print titles, descriptions, verification criteria,
          # bounty IDs, or event payloads because Actions logs are public in this repo.
          # A non-zero exit is only a signal that the private Bounty dashboard/API
          # needs operator review; it never claims or submits work.
          if candidate_count or release_event_count:
              print("AION_BOUNTY_CANDIDATES_PRESENT")
              raise SystemExit(2)
          PY
