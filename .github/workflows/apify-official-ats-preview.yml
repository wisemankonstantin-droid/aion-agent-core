name: AION Official ATS Apify build (manual)

# Pushes run only a no-cost credential preflight. Actor builds require manual dispatch
# until Apify account usage limits and a bounded build/test budget are verified.
# Neither path publishes to the Store, enables PPE billing, or touches Render.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apify-official-ats-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aion-apify-official-ats
  cancel-in-progress: false

jobs:
  verify-apify-credential:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token and AION account without building an Actor
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ.get("APIFY_TOKEN", "")
          if not token:
              raise SystemExit("APIFY_TOKEN repository secret is missing")
          request = Request(
              "https://api.apify.com/v2/users/me",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urlopen(request, timeout=15) as response:
              result = json.load(response)
          username = result.get("data", {}).get("username")
          if not username:
              raise SystemExit("Apify token response did not include an account username")
          print(f"Apify authentication preflight PASS for {username} (no Actor build or run)")
          PY

  build-actor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Actor files
        run: |
          set -euo pipefail
          test -f products/official_ats_signals/.actor/actor.json
          test -f products/official_ats_signals/.actor/input_schema.json
          test -f products/official_ats_signals/Dockerfile
          test -f products/official_ats_signals/main.py
          test -f products/official_ats_signals/collector.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Push and build Actor on Apify
        id: apify
        uses: apify/push-actor-action@5cc259c1492e59394a1e3db984b966e16a3d026c # v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: products/official_ats_signals

      - name: Report non-secret build result
        env:
          BUILD_ID: ${{ steps.apify.outputs.build-id }}
          BUILD_STATUS: ${{ steps.apify.outputs.build-status }}
        run: |
          echo "Apify build ID: $BUILD_ID"
          echo "Apify build status: $BUILD_STATUS"
