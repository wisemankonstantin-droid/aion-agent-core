name: AION Official ATS Apify build (manual)

# Pushes run only a no-cost credential preflight. Actor builds require manual dispatch
# until Apify account usage limits and a bounded build/test budget are verified.
# Neither path publishes to the Store, enables PPE billing, or touches Render.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apify-official-ats-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aion-apify-official-ats
  cancel-in-progress: false

jobs:
  verify-apify-credential:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token and AION account without building an Actor
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ.get("APIFY_TOKEN", "")
          if not token:
              raise SystemExit("APIFY_TOKEN repository secret is missing")
          request = Request(
              "https://api.apify.com/v2/users/me",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urlopen(request, timeout=15) as response:
              result = json.load(response)
          username = result.get("data", {}).get("username")
          if not username:
              raise SystemExit("Apify token response did not include an account username")
          print(f"Apify authentication preflight PASS for {username} (no Actor build or run)")

          # Read-only billing check; do not log private user JSON or credentials.
          from decimal import Decimal, InvalidOperation
          def get_data(path):
              req = Request(
                  "https://api.apify.com/v2/" + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urlopen(req, timeout=15) as response:
                  return json.load(response).get("data", {})

          limits = get_data("users/me/limits")
          current = limits.get("current", {})
          ceiling = limits.get("limits", {})
          plan = result.get("data", {}).get("plan", {})
          def nonnegative(value, label):
              try:
                  n = Decimal(str(value))
              except (InvalidOperation, TypeError):
                  raise SystemExit(f"Apify {label} is missing or invalid")
              if not n.is_finite() or n < 0:
                  raise SystemExit(f"Apify {label} is invalid")
              return n

          usage = nonnegative(current.get("monthlyUsageUsd"), "monthly usage")
          max_usage = nonnegative(ceiling.get("maxMonthlyUsageUsd"), "monthly cap")
          prepaid = nonnegative(plan.get("monthlyUsageCreditsUsd"), "prepaid monthly credits")
          remaining_prepaid = max(Decimal("0"), prepaid - usage)
          remaining_under_cap = max(Decimal("0"), max_usage - usage)
          print(f"Apify monthly usage (USD): {usage}")
          print(f"Apify plan prepaid credits (USD): {prepaid}")
          print(f"Apify monthly hard limit (USD): {max_usage}")
          print(f"Apify unused prepaid allowance (USD): {remaining_prepaid}")
          print(f"Apify unused monthly hard-limit room (USD): {remaining_under_cap}")
          if not remaining_prepaid or not remaining_under_cap:
              raise SystemExit("BLOCKED: No confirmed prepaid capacity for Actor build")
          if remaining_under_cap > Decimal("1"):
              print("HOLD: account-wide hard limit exceeds the authorized $1 experiment")
          else:
              print("PASS: account monthly headroom is within $1, subject to separate existing-credits check")
          print("COST PREFLIGHT COMPLETE: no Actor build/run, billing mutation or payment")
          PY

  build-actor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check Actor files
        run: |
          set -euo pipefail
          test -f products/official_ats_signals/.actor/actor.json
          test -f products/official_ats_signals/.actor/input_schema.json
          test -f products/official_ats_signals/Dockerfile
          test -f products/official_ats_signals/main.py
          test -f products/official_ats_signals/collector.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Push and build Actor on Apify
        id: apify
        uses: apify/push-actor-action@5cc259c1492e59394a1e3db984b966e16a3d026c # v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          working-directory: products/official_ats_signals

      - name: Report non-secret build result
        env:
          BUILD_ID: ${{ steps.apify.outputs.build-id }}
          BUILD_STATUS: ${{ steps.apify.outputs.build-status }}
        run: |
          echo "Apify build ID: $BUILD_ID"
          echo "Apify build status: $BUILD_STATUS"
