name: Publish Cloud.ru reasoning gateway image

on:
  push:
    branches:
      - ops/publish-cloudru-gateway

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/cloudru_reasoning_gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wisemankonstantin-droid/aion-cloudru-reasoning-gateway:latest
            ghcr.io/wisemankonstantin-droid/aion-cloudru-reasoning-gateway:${{ github.sha }}
