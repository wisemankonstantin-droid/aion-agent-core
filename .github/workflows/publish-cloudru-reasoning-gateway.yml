name: Publish Cloud.ru reasoning gateway image

on:
  push:
    branches:
      - ops/publish-cloudru-gateway

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: aion-gateway.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_REGISTRY_USERNAME }}
          password: ${{ secrets.CLOUDRU_REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - name: Copy the verified gateway image to Cloud.ru
        run: |
          docker buildx imagetools create \
            --tag aion-gateway.cr.cloud.ru/aion-cloudru-reasoning-gateway:latest \
            ghcr.io/wisemankonstantin-droid/aion-cloudru-reasoning-gateway@sha256:13df77b163bc954374086e3c8cd54c3cc7a41e20b453c750d4ebcfa3fb466f92
