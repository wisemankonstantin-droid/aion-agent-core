name: AION Production World Bank Smoke

on:
  push:
    branches:
      - codex/post-merge-agent-native-state-sync-v1
    paths:
      - .github/workflows/prod-world-bank-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute bounded zero-cost production smoke
        env:
          AION_BASE_URL: https://aion-agent-core-live.onrender.com
          AION_EXPECTED_RELEASE_SHA: 094077fb4f4d853714764c73a2890b157da7141d
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["AION_BASE_URL"].rstrip("/")
          expected_sha = os.environ["AION_EXPECTED_RELEASE_SHA"]

          def call(method, path, body=None, headers=None):
              payload = None if body is None else json.dumps(body, separators=(",", ":")).encode()
              req_headers = {"User-Agent": "AION-Authorized-Production-Smoke/1.0"}
              if body is not None:
                  req_headers["Content-Type"] = "application/json"
              if headers:
                  req_headers.update(headers)
              req = urllib.request.Request(base + path, data=payload, headers=req_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      return resp.status, json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode(errors="replace")
                  raise RuntimeError(f"{method} {path} failed HTTP {exc.code}: {detail[:500]}") from exc

          _, health = call("GET", "/health")
          assert health["status"] == "ok", health
          assert health["release_sha"] == expected_sha, health

          _, readiness = call("GET", "/readiness")
          assert readiness["status"] == "ready", readiness
          assert readiness["expected_schema_revision"] == "0016_official_data_execution_v1", readiness
          assert readiness["database_schema_revision"] == "0016_official_data_execution_v1", readiness
          assert readiness["schema_current"] is True, readiness

          _, joined = call(
              "POST",
              "/agents",
              {
                  "external_id": "aion-prod-world-bank-smoke-20260920-094077fb",
                  "name": "AION Production World Bank Smoke Agent",
                  "description": "Authorized one-shot zero-cost production verification agent.",
                  "protocol": "REST",
                  "acquisition_source": "authorized_production_smoke",
                  "owner_required": False,
                  "capabilities": []
              },
          )
          key = joined["agent_key"]
          print(f"::add-mask::{key}")
          auth = {"Authorization": f"Bearer {key}"}

          _, result = call(
              "POST",
              "/commercial/executions/world-bank-population",
              {
                  "capability": "world_bank.population.latest",
                  "country_code": "US",
                  "authorize_external_contact": True
              },
              {
                  **auth,
                  "Idempotency-Key": "prod-world-bank-smoke-20260920-094077fb"
              },
          )

          assert result["state"] == "completed", result
          assert result["request"]["capability"] == "world_bank.population.latest", result
          assert result["request"]["country_code"] == "US", result
          assert result["execution"]["provider_invoked"] is True, result
          assert result["execution"]["outbound_attempts"] == 1, result
          assert result["execution"]["http_status"] == 200, result
          assert result["execution"]["actual_provider_cost"] == "0", result
          assert result["execution"]["actual_customer_price"] == "0", result
          assert result["verification"]["capability_verified"] is True, result
          assert result["outcome"]["machine_completion_state"] == "machine_verified_result_delivered", result
          assert result["outcome"]["human_usefulness_confirmation_required"] is False, result
          assert result["truth_boundaries"]["zero_price_execution_is_not_revenue_or_settlement"] is True, result
          normalized = result["execution"]["normalized_result"]
          assert normalized["country_code"] == "US", normalized
          assert isinstance(normalized["population"], int) and normalized["population"] > 0, normalized
          execution_id = result["execution_id"]

          _, status = call("GET", f"/commercial/executions/{execution_id}", headers=auth)
          assert status["execution_id"] == execution_id, status
          assert status["state"] == "completed", status
          assert status["verification"]["capability_verified"] is True, status

          print(json.dumps({
              "status": "pass",
              "release_sha": health["release_sha"],
              "schema_revision": readiness["database_schema_revision"],
              "execution_id": execution_id,
              "capability": result["request"]["capability"],
              "country_code": normalized["country_code"],
              "observation_year": normalized.get("observation_year"),
              "population": normalized["population"],
              "provider_http_status": result["execution"]["http_status"],
              "machine_completion_state": result["outcome"]["machine_completion_state"],
              "provider_cost_usd": result["execution"]["actual_provider_cost"],
              "customer_price_usd": result["execution"]["actual_customer_price"],
              "human_usefulness_confirmation_required": result["outcome"]["human_usefulness_confirmation_required"],
              "payment_or_settlement_created": False
          }, sort_keys=True))
          PY
