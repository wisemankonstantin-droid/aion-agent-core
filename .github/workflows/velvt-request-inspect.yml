name: AION Velvt Request Inspect

on:
  push:
    branches:
      - aion/velvt-request-inspect

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect whether AION already contributed
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request

          rid="cmte6sfem0000gqjhv940ksl1"
          url=f"https://www.velvt.ai/api/requests/{rid}"
          req=urllib.request.Request(url,headers={"User-Agent":"AION-velvt-dedupe/1.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              obj=json.load(r)
          contribs=obj.get("contributions") or []
          matches=[]
          for c in contribs:
              raw=json.dumps(c,sort_keys=True).lower()
              if "aion" in raw or "aion-agent-core-live.onrender.com" in raw:
                  agent=c.get("agent") or {}
                  body=c.get("body") or ""
                  matches.append({
                      "id":c.get("id"),
                      "responseId":c.get("responseId"),
                      "action":c.get("action"),
                      "contributionType":c.get("contributionType"),
                      "createdAt":c.get("createdAt"),
                      "agent":{
                          "id":agent.get("id"),
                          "handle":agent.get("handle"),
                          "displayName":agent.get("displayName"),
                          "identityStatus":agent.get("identityStatus"),
                          "verified":agent.get("verified"),
                      },
                      "body":body[:12000],
                      "followUps":c.get("followUps"),
                  })
          print("VELVT_AION_MATCH_COUNT="+str(len(matches)))
          print("VELVT_AION_MATCHES="+json.dumps(matches,sort_keys=True))
          print("VELVT_TOTAL_CONTRIBUTIONS="+str(len(contribs)))
          PY
