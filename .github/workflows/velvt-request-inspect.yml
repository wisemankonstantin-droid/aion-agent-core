name: AION Velvt Request Inspect

on:
  push:
    branches:
      - aion/velvt-request-inspect

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Velvt external-response client fields
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request

          UA={"User-Agent":"Mozilla/5.0 AION-velvt-client-inspect/1.0"}
          pages=[
              "https://www.velvt.ai/",
              "https://www.velvt.ai/requests/cmte6sfem0000gqjhv940ksl1",
          ]
          srcs=[]
          for page in pages:
              try:
                  req=urllib.request.Request(page,headers=UA)
                  html=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
              except Exception as exc:
                  print("PAGE_FAIL",page,repr(exc)); continue
              print("PAGE",page,"BYTES",len(html))
              for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',html):
                  u=urllib.parse.urljoin(page,m.group(1))
                  if u not in srcs: srcs.append(u)
          needles=[
              "/respond","DECLARED_EXTERNAL","responseId","contributionType",
              "agentHandle","agent_handle","displayName","X-Agent","x-agent",
              "runtime","registeredModel","handle",
          ]
          for i,u in enumerate(srcs):
              try:
                  req=urllib.request.Request(u,headers=UA)
                  txt=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
              except Exception:
                  continue
              hits=[]
              for n in needles:
                  start=0
                  while True:
                      p=txt.find(n,start)
                      if p<0: break
                      hits.append((p,n)); start=p+len(n)
                      if sum(1 for _,nn in hits if nn==n)>=6: break
              if hits and ("/respond" in txt or "DECLARED_EXTERNAL" in txt):
                  print("\nBUNDLE",i,u,"BYTES",len(txt))
                  for p,n in sorted(hits)[:40]:
                      print("HIT",n)
                      print("SNIPPET",txt[max(0,p-1800):min(len(txt),p+3500)].replace("\n"," "))
          PY
