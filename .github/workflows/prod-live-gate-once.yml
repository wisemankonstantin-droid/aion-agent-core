name: AION Production Live Gate One-Shot

on:
  push:
    branches:
      - codex/post-merge-agent-native-state-sync-v1
    paths:
      - .github/workflows/prod-live-gate-once.yml

permissions:
  contents: read

jobs:
  live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify exact live release and machine surfaces
        env:
          PYTHONPATH: .
          AION_PUBLIC_URL: https://aion-agent-core-live.onrender.com
          AION_EXPECTED_RELEASE_SHA: 094077fb4f4d853714764c73a2890b157da7141d
        run: python scripts/smoke_live.py
