name: AION Post-Publication Canary

on:
  push:
    branches:
      - fix/commercial-launch-privacy-origin-v1

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official MCP Registry discoverability
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          name = 'io.github.wisemankonstantin-droid/aion-agent-core'
          url = 'https://registry.modelcontextprotocol.io/v0.1/servers?search=' + urllib.parse.quote(name, safe='')
          with urllib.request.urlopen(url, timeout=20) as r:
              body = r.read().decode('utf-8')
              assert r.status == 200, r.status
          data = json.loads(body)
          text = json.dumps(data, sort_keys=True)
          assert name in text, text[:2000]
          assert '0.8.0' in text, text[:2000]
          print('MCP_DISCOVERABILITY_PASS', name, '0.8.0')
          PY

      - name: Verify A2A public listing
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://www.a2a-registry.org/agent/com.onrender.aion_supreme_temple_gateway'
          with urllib.request.urlopen(url, timeout=20) as r:
              body = r.read().decode('utf-8', errors='replace')
              assert r.status == 200, r.status
          assert 'AION SUPREME Temple Gateway' in body
          assert 'com.onrender.aion_supreme_temple_gateway' in body
          print('A2A_DISCOVERABILITY_PASS com.onrender.aion_supreme_temple_gateway')
          PY

      - name: Run bounded read-only external-discovery canary
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base = 'https://aion-agent-core-live.onrender.com'
          url = base + '/discover/external?q=' + urllib.parse.quote('agentnative')
          req = urllib.request.Request(url, headers={'User-Agent': 'AION-post-publication-canary/0.8.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode('utf-8')
              assert r.status == 200, r.status
          data = json.loads(body)
          text = json.dumps(data, sort_keys=True)
          print('AION_EXTERNAL_DISCOVERY_RESPONSE', text[:4000])
          assert 'agentnative' in text.lower() or 'com.cazimedia.agentnative_data_exchange' in text, text[:4000]
          print('BOUNDED_CANARY_PASS agentnative')
          PY
