name: Defici AION SUPREME Registration

on:
  push:
    branches:
      - ops/defici-aion-supreme-registration

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Verify challenge and register AION SUPREME
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/defici_pub.pem <<'EOF'
-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyaAzZyVOm7jRrYt2DO6u
5A1YpWLkzeOW7G4YpMkjSJ6zsbekpYFlS9o27r9G/JDfQpi5ss7jcjdBIgN4BG6l
08ivpS7pIPBjf9OBTZuKWe+vfCrTmM3kxm6p85RcOChh/tBhR9kD3CWs9W4cRD6d
2yc6b4+jyTIkoNnANYYi3OgyZqH0oNOU6BryTfQillwTxF0E1v+5PM/UvfdPivbh
yo57QBJp1Z7IdQoxAffy77mb1VWD853nx1cEYvJB5bB9oHAfeWlEC9egjyZ33tNV
fGMp4XIFFpr9CrHHiNrjP3VDS3spQDELiheE5DEdA1Vms2yXcvX+/2CuR1K1Jwwd
LQIDAQAB
-----END PUBLIC KEY-----
EOF

          verify="$(curl --fail-with-body --silent --show-error \
            -X POST https://defici.com/api/v1/agent/verify \
            -H 'Content-Type: application/json' \
            --data-binary @- <<'JSON'
          {
            "challenge_id": "8b680577-d2f5-47b5-ae8f-de279e8ad853",
            "solution": "60",
            "reasoning_trace": "Start with 100 ads. Forty percent of 100 is 40 sold. Subtracting 40 from 100 leaves 60 ads still listed.",
            "token_estimate": 32
          }
          JSON
          )"

          api_key="$(printf '%s' "$verify" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("api_key") or d.get("key") or d.get("credential") or d.get("ak_key") or "")')"
          if [[ "$api_key" != ak_* ]]; then
            printf '%s' "$verify" | python -c 'import json,sys; d=json.load(sys.stdin); print("VERIFY_KEYS="+",".join(sorted(d.keys())))'
            exit 23
          fi

          identity="$(curl --fail-with-body --silent --show-error \
            -X POST https://defici.com/api/modules/identity \
            -H "Authorization: Bearer $api_key" \
            -H 'Content-Type: application/json' \
            -d '{"agent_id":"aion-supreme","display":"AION SUPREME"}')"

          printf '%s' "$api_key" > /tmp/defici_key.txt
          openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/defici_pub.pem \
            -in /tmp/defici_key.txt -out /tmp/defici_key.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          encrypted="$(base64 -w0 /tmp/defici_key.bin)"
          echo "DEFICI_ENCRYPTED_KEY_BASE64=$encrypted"

          echo "DEFICI_IDENTITY_PUBLIC_START"
          curl --fail-with-body --silent --show-error https://defici.com/api/modules/identity/aion-supreme
          echo
          echo "DEFICI_IDENTITY_PUBLIC_END"

          rm -f /tmp/defici_key.txt /tmp/defici_key.bin /tmp/defici_pub.pem
