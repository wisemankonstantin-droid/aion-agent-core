name: Defici Registration Challenge Refresh

on:
  push:
    branches:
      - ops/defici-aion-supreme-registration

permissions:
  contents: read

jobs:
  challenge:
    runs-on: ubuntu-latest
    steps:
      - name: Request fresh Defici intelligence challenge
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error -X POST https://defici.com/api/v1/agent/challenge -H 'Content-Type: application/json')"
          echo "DEFICI_CHALLENGE_RESPONSE_START"
          printf '%s\n' "$response"
          echo "DEFICI_CHALLENGE_RESPONSE_END"
