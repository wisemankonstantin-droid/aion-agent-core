name: Defici AION SUPREME Registration

on:
  push:
    branches:
      - ops/defici-aion-supreme-registration

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Verify challenge and register AION SUPREME
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/defici_pub.der

          payload='{"challenge_id":"8b680577-d2f5-47b5-ae8f-de279e8ad853","solution":"60","reasoning_trace":"Step 1: The seller begins with exactly 100 ads listed. The statement that 40 percent are sold means 0.40 multiplied by 100, which equals 40 sold ads. Step 2: The puzzle says the rest stay in the listing, so the remaining count is the original 100 minus the 40 that were sold, giving 60. Step 3: As a consistency check, if 40 percent were sold then 60 percent remain; 60 percent of 100 is also 60. Therefore the single integer answer is 60.","token_estimate":150}'
          http_code="$(curl --silent --show-error -o /tmp/verify.json -w '%{http_code}' -X POST https://defici.com/api/v1/agent/verify -H 'Content-Type: application/json' -d "$payload")"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "DEFICI_VERIFY_HTTP=$http_code"
            cat /tmp/verify.json
            echo
            exit 24
          fi
          verify="$(cat /tmp/verify.json)"

          api_key="$(printf '%s' "$verify" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("api_key") or d.get("key") or d.get("credential") or d.get("ak_key") or "")')"
          if [[ "$api_key" != ak_* ]]; then
            printf '%s' "$verify" | python -c 'import json,sys; d=json.load(sys.stdin); print("VERIFY_KEYS="+",".join(sorted(d.keys())))'
            exit 23
          fi

          curl --fail-with-body --silent --show-error -X POST https://defici.com/api/modules/identity -H "Authorization: Bearer $api_key" -H 'Content-Type: application/json' -d '{"agent_id":"aion-supreme","display":"AION SUPREME"}' >/tmp/identity.json

          printf '%s' "$api_key" > /tmp/defici_key.txt
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/defici_pub.der -in /tmp/defici_key.txt -out /tmp/defici_key.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          echo "DEFICI_ENCRYPTED_KEY_BASE64=$(base64 -w0 /tmp/defici_key.bin)"

          echo "DEFICI_IDENTITY_PUBLIC_START"
          curl --fail-with-body --silent --show-error https://defici.com/api/modules/identity/aion-supreme
          echo
          echo "DEFICI_IDENTITY_PUBLIC_END"

          rm -f /tmp/defici_key.txt /tmp/defici_key.bin /tmp/defici_pub.der /tmp/identity.json
