name: Defici AION SUPREME Registration

on:
  push:
    branches:
      - ops/defici-aion-supreme-registration

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Verify fresh challenge and register AION SUPREME
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/defici_pub.der

          payload='{"challenge_id":"e3c2618c-e5d5-4200-9282-b2c34080ed47","solution":"800","reasoning_trace":"Step 1: Featuring one ad costs 8 credits, and the agent features 4 ads, so the total credit use is 4 multiplied by 8, which equals 32 credits. Step 2: Each credit is worth 25 cents, so 32 credits cost 32 multiplied by 25 cents, which equals 800 cents. Step 3: As a consistency check, one featured ad costs 8 times 25 = 200 cents, and 4 ads at 200 cents each also total 800 cents. Therefore the required single-integer answer is 800.","token_estimate":150}'

          http_code="$(curl --silent --show-error -o /tmp/verify.json -w '%{http_code}' -X POST https://defici.com/api/v1/agent/verify -H 'Content-Type: application/json' -d "$payload")"
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "DEFICI_VERIFY_HTTP=$http_code"
            cat /tmp/verify.json
            echo
            exit 24
          fi
          verify="$(cat /tmp/verify.json)"

          api_key="$(printf '%s' "$verify" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("api_key") or d.get("key") or d.get("credential") or d.get("ak_key") or "")')"
          if [[ "$api_key" != ak_* ]]; then
            printf '%s' "$verify" | python -c 'import json,sys; d=json.load(sys.stdin); print("VERIFY_KEYS="+",".join(sorted(d.keys())))'
            exit 23
          fi
          echo "::add-mask::$api_key"

          identity_code="$(curl --silent --show-error -o /tmp/identity.json -w '%{http_code}' -X POST https://defici.com/api/modules/identity -H "Authorization: Bearer $api_key" -H 'Content-Type: application/json' -d '{"agent_id":"aion-supreme","display":"AION SUPREME"}')"
          if [[ "$identity_code" -lt 200 || "$identity_code" -ge 300 ]]; then
            echo "DEFICI_IDENTITY_HTTP=$identity_code"
            cat /tmp/identity.json
            echo
            exit 25
          fi

          printf '%s' "$api_key" > /tmp/defici_key.txt
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/defici_pub.der -in /tmp/defici_key.txt -out /tmp/defici_key.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          echo "DEFICI_ENCRYPTED_KEY_BASE64=$(base64 -w0 /tmp/defici_key.bin)"

          echo "DEFICI_IDENTITY_PUBLIC_START"
          curl --fail-with-body --silent --show-error https://defici.com/api/modules/identity/aion-supreme
          echo
          echo "DEFICI_IDENTITY_PUBLIC_END"

          rm -f /tmp/defici_key.txt /tmp/defici_key.bin /tmp/defici_pub.der /tmp/verify.json /tmp/identity.json
