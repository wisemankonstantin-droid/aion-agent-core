name: AION CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AION_REQUIRE_A2A: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m pip check
      - run: python scripts/check_secrets.py
      - run: python -m pytest -q
      - run: rm -f .aion-test.db && python scripts/readiness.py
      - name: Migration smoke
        run: |
          rm -f /tmp/aion-migration.db
          DATABASE_URL=sqlite:////tmp/aion-migration.db alembic upgrade head
          DATABASE_URL=sqlite:////tmp/aion-migration.db alembic current
