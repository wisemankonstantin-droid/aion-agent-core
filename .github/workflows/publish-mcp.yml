name: Publish AION to MCP Registry

on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "Deployed AION HTTPS URL"
        required: true
        type: string
      expected_release_sha:
        description: "Exact approved deployed 40-hex Git commit"
        required: true
        type: string
      validate_only:
        description: "Validate but do not publish"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Live gate first
        env:
          AION_PUBLIC_URL: ${{ inputs.public_url }}
          AION_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
        run: python scripts/smoke_live.py
      - name: Generate MCP Registry metadata
        env:
          AION_PUBLIC_URL: ${{ inputs.public_url }}
        run: python scripts/render_server_json.py
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        if: ${{ !inputs.validate_only }}
        run: ./mcp-publisher login github-oidc
      - name: Publish
        if: ${{ !inputs.validate_only }}
        run: ./mcp-publisher publish server.json
