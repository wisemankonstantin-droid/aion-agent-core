services:
  - type: web
    name: aion-agent-core
    runtime: python
    plan: free
    buildCommand: python -m pip install --require-hashes -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AION_APP_VERSION
        value: 0.7.1
      - key: DATABASE_URL
        fromDatabase:
          name: aion-agent-db
          property: connectionString
      - key: AION_REQUIRE_A2A
        value: "1"
      - key: AION_JOIN_RATE_PER_MINUTE
        value: "60"
      - key: AION_MCP_RATE_PER_MINUTE
        value: "600"
      - key: AION_EXTERNAL_DISCOVERY_TIMEOUT
        value: "4"
      - key: AION_RETURN_THRESHOLD_MINUTES
        value: "15"

databases:
  - name: aion-agent-db
    plan: free
    databaseName: aion
    user: aion
